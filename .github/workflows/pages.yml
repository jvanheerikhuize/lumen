name: Deploy Meta-Specs Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Fetch Spec-Blueprint and build Pages workspace
        run: |
          VER=$(grep -i '^Spec-Blueprint:' TECH_STACK.md | sed -E 's/.*asdlc-meta-specs@([A-Za-z0-9._-]+).*/\1/' || true)
          VER=${VER:-latest}
          BASE_URL="https://jvanheerikhuize.github.io/asdlc-meta-specs/${VER}"
          curl -fsSL "${BASE_URL}/tools/spec.py" -o /tmp/spec.py
          python3 /tmp/spec.py --root . check --strict
          if [ -f site/index.html ]; then
            TARGET="site/specs"
          else
            TARGET="site"
          fi
          mkdir -p "${TARGET}"
          for f in index.html app.js styles.css; do
            curl -fsSL "${BASE_URL}/site/${f}" -o "${TARGET}/${f}"
          done
          python3 /tmp/spec.py --root . index --out "${TARGET}/data/index.json"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
