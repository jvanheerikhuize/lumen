services:
  lumen:
    image: ghcr.io/jvanheerikhuize/lumen:latest
    build: .
    container_name: lumen
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - PROWLARR_URL=${PROWLARR_URL:-}
      - PROWLARR_API_KEY=${PROWLARR_API_KEY:-}
      - JACKETT_URL=${JACKETT_URL:-}
      - JACKETT_API_KEY=${JACKETT_API_KEY:-}
      - LUMEN_ALLOW_PRIVATE_ADDONS=${LUMEN_ALLOW_PRIVATE_ADDONS:-0}
      - LUMEN_HWACCEL=${LUMEN_HWACCEL:-none}
      - LUMEN_DATA_DIR=/app/data
    volumes:
      - lumen_data:/app/data
      # Or use a host bind mount (ensure UID 10001 owns ./data: sudo chown -R 10001:10001 ./data):
      # - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  lumen_data:
